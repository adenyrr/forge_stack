name: forge-runner

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gitlab-runner:
    image: gitlab/gitlab-runner:v19.5.3@sha256:ffe21f021468d4aa1e56f05316d88597c23bf4818840e8edaa858131fabd7991
    container_name: gitlab-runner
    restart: unless-stopped
    user: "0:0"
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./config
        target: /etc/gitlab-runner
        bind:
          create_host_path: false
      - type: bind
        source: ${SOCKET:-/run/user/1001/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
    # Aucun port entrant, réseau partagé, host-gateway ou depends_on distant.
