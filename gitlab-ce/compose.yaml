name: forge

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gitlab:
    image: gitlab/gitlab-ce:19.5.3-ce.0@sha256:6863d156a1a477bd6f69fc674b671d0163cd8b06bf63bb17cc4a4a803b78b27c
    container_name: gitlab-ce
    restart: always
    user: "0:0"
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 6G
    environment:
      GITLAB_EXTERNAL_URL: ${GITLAB_EXTERNAL_URL:?Définir GITLAB_EXTERNAL_URL}
      REGISTRY_EXTERNAL_URL: ${REGISTRY_EXTERNAL_URL:?Définir REGISTRY_EXTERNAL_URL}
      GITLAB_TLS_CERTIFICATE: ${GITLAB_TLS_CERTIFICATE:?Définir GITLAB_TLS_CERTIFICATE}
      GITLAB_TLS_KEY: ${GITLAB_TLS_KEY:?Définir GITLAB_TLS_KEY}
      REGISTRY_TLS_CERTIFICATE: ${REGISTRY_TLS_CERTIFICATE:?Définir REGISTRY_TLS_CERTIFICATE}
      REGISTRY_TLS_KEY: ${REGISTRY_TLS_KEY:?Définir REGISTRY_TLS_KEY}
      GITLAB_OMNIBUS_CONFIG: |
        external_url ENV.fetch('GITLAB_EXTERNAL_URL')
        registry['enable'] = true
        gitlab_rails['registry_enabled'] = true
        registry_external_url ENV.fetch('REGISTRY_EXTERNAL_URL')
        gitlab_rails['time_zone'] = '${TZ}'

        letsencrypt['enable'] = false
        gitlab_rails['nginx']['listen_https'] = true
        gitlab_rails['nginx']['listen_port'] = 443
        gitlab_rails['nginx']['ssl_certificate'] = ENV.fetch('GITLAB_TLS_CERTIFICATE')
        gitlab_rails['nginx']['ssl_certificate_key'] = ENV.fetch('GITLAB_TLS_KEY')
        registry['nginx']['enable'] = true
        registry['nginx']['listen_https'] = true
        registry['nginx']['listen_port'] = 443
        registry['nginx']['ssl_certificate'] = ENV.fetch('REGISTRY_TLS_CERTIFICATE')
        registry['nginx']['ssl_certificate_key'] = ENV.fetch('REGISTRY_TLS_KEY')

        # Optimisation RAM (Réduction des workers et désactivation monitoring)

        puma['worker_processes'] = 2
        puma['min_threads'] = 1
        puma['max_threads'] = 2
        sidekiq['max_concurrency'] = 10
        prometheus_monitoring['enable'] = false
        postgresql['shared_buffers'] = "256MB"

        # ── Optimisation DISQUE ────────────────────────────────────────

        # Rotation agressive des logs (/var/log/gitlab)
        logging['logrotate_frequency'] = "daily"
        logging['logrotate_maxsize']   = "50M"
        logging['logrotate_rotate']    = 7
        logging['logrotate_compress']  = "compress"
        logging['logrotate_method']    = "copytruncate"
        logging['svlogd_size'] = 50 * 1024 * 1024
        logging['svlogd_num']  = 4

        # Rétention des sauvegardes internes (3 jours)
        gitlab_rails['backup_keep_time'] = 259200

        # WAL PostgreSQL borné
        postgresql['max_wal_size'] = "1GB"
        postgresql['min_wal_size'] = "80MB"

        # Suppression réelle dans le registry (obligatoire pour les
        # cleanup policies et le garbage collect)
        registry['storage_delete_enabled'] = true


        gitlab_rails['packages_enabled']         = true
        gitlab_rails['dependency_proxy_enabled'] = true
        gitlab_rails['terraform_state_enabled']  = true
        gitlab_kas['enable']    = false
        gitlab_pages['enable']  = false

        # Configuration SSH

        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2222}

        # SMTP

        gitlab_rails['smtp_enable']               = true
        gitlab_rails['smtp_address']              = '${SMTP_HOST}'
        gitlab_rails['smtp_port']                 = 587
        gitlab_rails['smtp_user_name']            = '${SMTP_USER}'
        gitlab_rails['smtp_password']             = '${SMTP_PASSWORD}'
        gitlab_rails['smtp_domain']               = '${SMTP_DOMAIN}'
        gitlab_rails['smtp_authentication']       = 'login'
        gitlab_rails['smtp_enable_starttls_auto'] = true
        gitlab_rails['smtp_tls']                  = false
        gitlab_rails['gitlab_email_from']         = '${GITLAB_EMAIL}'

        # Signature des commits

        gitaly['configuration'] = {
          git: {
            signing_key: '/etc/gitlab/gitaly/signing_key',
          },
        }

        # OIDC Authentik

        gitlab_rails['omniauth_enabled'] = true
        gitlab_rails['omniauth_allow_single_sign_on'] = ['openid_connect']
        gitlab_rails['omniauth_block_auto_created_users'] = false
        gitlab_rails['omniauth_providers'] = [
          {
            name: 'openid_connect',
            label: 'OIDC',
            args: {
              name: 'openid_connect',
              scope: ['openid', 'profile', 'email'],
              response_type: 'code',
              issuer: '${ISSUER}',
              discovery: true,
              client_auth_method: 'query',
              uid_field: 'preferred_username',
              client_options: {
                identifier: '${CLIENT_ID}',
                secret: '${CLIENT_SECRET}',
                redirect_uri: '${REDIRECT_URL}'
              }
            }
          }
        ]

    ports:
      - '${SSH_BIND_IP:-0.0.0.0}:${GITLAB_SSH_PORT:-2222}:22'
      # Port non privilégié sur l'hôte rootless ; entrée publique 443 à acheminer ici.
      # GitLab et Registry partagent ce port via leurs noms SNI distincts.
      - '${HTTPS_BIND_IP:?Définir HTTPS_BIND_IP}:${HTTPS_PORT:-8443}:443'
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
      # Monter le répertoire, pas les fichiers : step peut les remplacer atomiquement.
      - type: bind
        source: ${TLS_DIRECTORY:?Définir le répertoire existant des certificats}
        target: /etc/gitlab/ssl
        read_only: true
        bind:
          create_host_path: false
    shm_size: '256m'
    healthcheck:
      # Sonde locale de disponibilité uniquement ; la validation PKI se teste côté client.
      test: ["CMD", "curl", "--fail", "--silent", "--insecure", "https://localhost/-/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 600s

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
