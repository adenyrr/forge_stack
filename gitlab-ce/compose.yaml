name: forge

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gitlab:
    image: gitlab/gitlab-ce:19.5.3-ce.0@sha256:6863d156a1a477bd6f69fc674b671d0163cd8b06bf63bb17cc4a4a803b78b27c
    container_name: gitlab-ce
    restart: always
    # UID 0 dans le conteneur = UID 1001 sur l'hôte avec Docker rootless.
    # Omnibus doit conserver ses UID internes et ses capacités par défaut.
    user: "0:0"
    hostname: ${GITLAB_HOSTNAME:?Définir GITLAB_HOSTNAME}
    logging: *default-logging
    networks:
      - gitlab-net
      - traefik
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 6G
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://${GITLAB_HOSTNAME:?Définir GITLAB_HOSTNAME}'
        registry_external_url 'https://${REGISTRY_HOSTNAME:?Définir REGISTRY_HOSTNAME}'
        gitlab_rails['time_zone'] = '${TZ}'

        # TLS géré par Traefik — GitLab nginx en HTTP

        nginx['listen_port']   = 80
        nginx['listen_https']  = false
        registry_nginx['listen_port']  = 5050
        registry_nginx['listen_https'] = false
        letsencrypt['enable']  = false

        nginx['real_ip_trusted_addresses'] = '${TRUSTED_PROXIES:?Définir les IP/CIDR des proxies de confiance}'.split(',').map(&:strip)
        nginx['real_ip_header']    = 'X-Forwarded-For'
        nginx['real_ip_recursive'] = 'on'
        gitlab_rails['trusted_proxies'] = '${TRUSTED_PROXIES:?Définir les IP/CIDR des proxies de confiance}'.split(',').map(&:strip)

        nginx['proxy_set_headers'] = {
          "X-Forwarded-Proto" => "https",
          "X-Forwarded-Ssl" => "on"
        }

        # Optimisation RAM (Réduction des workers et désactivation monitoring)

        puma['worker_processes'] = 2
        puma['min_threads'] = 1
        puma['max_threads'] = 2
        sidekiq['max_concurrency'] = 10
        prometheus_monitoring['enable'] = false
        postgresql['shared_buffers'] = "256MB"

        # ── Optimisation DISQUE ────────────────────────────────────────

        # Rotation agressive des logs (/var/log/gitlab)
        logging['logrotate_frequency'] = "daily"
        logging['logrotate_maxsize']   = "50M"
        logging['logrotate_rotate']    = 7
        logging['logrotate_compress']  = "compress"
        logging['logrotate_method']    = "copytruncate"
        logging['svlogd_size'] = 50 * 1024 * 1024
        logging['svlogd_num']  = 4

        # Rétention des sauvegardes internes (3 jours)
        gitlab_rails['backup_keep_time'] = 259200

        # WAL PostgreSQL borné
        postgresql['max_wal_size'] = "1GB"
        postgresql['min_wal_size'] = "80MB"

        # Suppression réelle dans le registry (obligatoire pour les
        # cleanup policies et le garbage collect)
        registry['storage_delete_enabled'] = true


        gitlab_rails['packages_enabled']         = true
        gitlab_rails['dependency_proxy_enabled'] = true
        gitlab_rails['terraform_state_enabled']  = true
        gitlab_kas['enable']    = false
        gitlab_pages['enable']  = false

        # Configuration SSH

        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2222}

        # SMTP

        gitlab_rails['smtp_enable']               = true
        gitlab_rails['smtp_address']              = '${SMTP_HOST}'
        gitlab_rails['smtp_port']                 = 587
        gitlab_rails['smtp_user_name']            = '${SMTP_USER}'
        gitlab_rails['smtp_password']             = '${SMTP_PASSWORD}'
        gitlab_rails['smtp_domain']               = '${SMTP_DOMAIN}'
        gitlab_rails['smtp_authentication']       = 'login'
        gitlab_rails['smtp_enable_starttls_auto'] = true
        gitlab_rails['smtp_tls']                  = false
        gitlab_rails['gitlab_email_from']         = '${GITLAB_EMAIL}'

        # Signature des commits

        gitaly['configuration'] = {
          git: {
            signing_key: '/etc/gitlab/gitaly/signing_key',
          },
        }

        # OIDC Authentik

        gitlab_rails['omniauth_enabled'] = true
        gitlab_rails['omniauth_allow_single_sign_on'] = ['openid_connect']
        gitlab_rails['omniauth_block_auto_created_users'] = false
        gitlab_rails['omniauth_providers'] = [
          {
            name: 'openid_connect',
            label: 'OIDC',
            args: {
              name: 'openid_connect',
              scope: ['openid', 'profile', 'email'],
              response_type: 'code',
              issuer: '${ISSUER}',
              discovery: true,
              client_auth_method: 'query',
              uid_field: 'preferred_username',
              client_options: {
                identifier: '${CLIENT_ID}',
                secret: '${CLIENT_SECRET}',
                redirect_uri: '${REDIRECT_URL}'
              }
            }
          }
        ]
    ports:
      - '${SSH_BIND_IP:-0.0.0.0}:${GITLAB_SSH_PORT:-2222}:22'
      # Boucle locale par défaut ; interface privée uniquement si Traefik est distant.
      - '${HTTP_BIND_IP:-127.0.0.1}:${GITLAB_HTTP_PORT:-8081}:80'
      - '${HTTP_BIND_IP:-127.0.0.1}:${REGISTRY_HTTP_PORT:-5050}:5050'
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    shm_size: '256m'
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "http://localhost/-/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 600s
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik"

      # ── Services ─────────────────────────────────────────────────────
      traefik.http.services.gitlab-svc.loadbalancer.server.port: "80"
      traefik.http.services.gitlab-svc.loadbalancer.server.scheme: "http"
      traefik.http.services.registry-svc.loadbalancer.server.port: "5050"
      traefik.http.services.registry-svc.loadbalancer.server.scheme: "http"

      # HTTP → HTTPS : redirection globale de l'entrypoint web d'internal_traefik.
      # Aucun middleware redirect-https@file requis.

      # ── GitLab HTTPS ──────────────────────────────────────────────────
      traefik.http.routers.gitlab-https.rule: "Host(`${GITLAB_HOSTNAME}`)"
      traefik.http.routers.gitlab-https.entrypoints: "websecure"
      traefik.http.routers.gitlab-https.tls: "true"
      traefik.http.routers.gitlab-https.tls.certresolver: "letsencrypt"
      traefik.http.routers.gitlab-https.service: "gitlab-svc"

      # ── Registry HTTPS ────────────────────────────────────────────────
      traefik.http.routers.registry-https.rule: "Host(`${REGISTRY_HOSTNAME}`)"
      traefik.http.routers.registry-https.entrypoints: "websecure"
      traefik.http.routers.registry-https.tls: "true"
      traefik.http.routers.registry-https.tls.certresolver: "letsencrypt"
      traefik.http.routers.registry-https.service: "registry-svc"

networks:
  gitlab-net:
    name: gitlab-net
    driver: bridge
  traefik:
    name: traefik
    external: true

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
