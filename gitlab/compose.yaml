services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab-ce
    restart: always
    hostname: ${GITLAB_HOSTNAME:-localhost}
    networks:
      - gitlab-net
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://${GITLAB_HOSTNAME}'
        registry_external_url '${REGISTRY_HOSTNAME}'

        # Configuration nginx

        registry_nginx['listen_port'] = 5000
        registry_nginx['listen_https'] = true


        # Optimisation RAM (Réduction des workers et désactivation monitoring)

        puma['worker_processes'] = 2
        puma['min_threads'] = 1
        puma['max_threads'] = 2
        sidekiq['max_concurrency'] = 10
        prometheus_monitoring['enable'] = false
        postgresql['shared_buffers'] = "256MB"

        # Configuration SSH

        gitlab_rails['gitlab_shell_ssh_port'] = 2222

        # ACME via PKI

        letsencrypt['enable'] = true
        letsencrypt['acme_production_endpoint'] = '${ACME_URL}'
        letsencrypt['auto_renew'] = true
        letsencrypt['auto_renew_hour'] = 3
        letsencrypt['auto_renew_minute'] = 30
        letsencrypt['auto_renew_day_of_month'] = "*/7"

        # Trust step-ca root CA pour les appels sortants (OIDC, webhooks)

        gitlab_rails['env'] = {
          'SSL_CERT_FILE' => '/etc/gitlab/trusted-certs/step-root-ca.crt'
        }

        # SSH
        gitlab_rails['gitlab_shell_ssh_port'] = 2222

        # OIDC Authentik

        gitlab_rails['omniauth_enabled'] = true
        gitlab_rails['omniauth_allow_single_sign_on'] = ['openid_connect']
        gitlab_rails['omniauth_block_auto_created_users'] = false
        gitlab_rails['omniauth_providers'] = [
          {
            name: 'openid_connect',
            label: 'OIDC',
            args: {
              name: 'openid_connect',
              scope: ['openid', 'profile', 'email'],
              response_type: 'code',
              issuer: '${ISSUER}',
              discovery: true,
              client_auth_method: 'query',
              uid_field: 'preferred_username',
              client_options: {
                identifier: '${CLIENT_ID}',
                secret: '${CLIENT_SECRET}',
                redirect_uri: '${REDIRECT_URL}'
              }
            }
          }
        ]
    ports:
      - '80:80'
      - '443:443'
      - '2222:22'
      - '5000:5000'
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
      - ./certs/step-root-ca.crt:/etc/gitlab/trusted-certs/step-root-ca.crt:ro
    shm_size: '256m'
    healthcheck:
      test: ["CMD", "/usr/bin/gitlab-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5

  runner:
    image: gitlab/gitlab-runner:latest
    container_name: gitlab-runner
    restart: always
    networks:
      - gitlab-net
    depends_on:
      gitlab:
        condition: service_healthy
    volumes:
      - gitlab-runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "${GITLAB_HOSTNAME:-localhost}:host-gateway"

networks:
  gitlab-net:
    driver: bridge

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
  gitlab-runner-config: